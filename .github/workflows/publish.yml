name: Publish miniapp (reusable)

# Reusable build+publish for ANY miniapp (ADR-016). Callers reference this with:
#
#   jobs:
#     publish:
#       uses: DentVega/miniapp-template/.github/workflows/publish.yml@main
#       secrets: inherit
#
# Fixing this file fixes the CI for every miniapp at once (they track @main) —
# no per-repo update needed. The miniapp id is read from manifest.json, so this
# workflow is fully generic (no placeholder substitution).

on:
  workflow_call:
    secrets:
      BACKSTAGE_URL:
        required: true
      PUBLISH_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (GitHub Packages)
        # pnpm ignores the ${TOKEN} in a committed .npmrc; write the auth to a
        # user-level ~/.npmrc with the literal token. @dentvega/* are public, so
        # the automatic GITHUB_TOKEN suffices to read them.
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          pnpm install --frozen-lockfile=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive truthful manifest.shared + compat gate
        # gen reescribe manifest.shared desde las deps reales ∩ host contract;
        # check valida el skew. Rollout-safe: sin contract publicado → skip (no rompe).
        # Para bloquear publishes incompatibles, setear la repo/org var COMPAT_ENFORCE=1
        # (tras publicar el contract + backfillear la flota).
        #
        # GUARD (Capa 1 vs Capa 2 lag): este workflow (@main) se activa para todas las
        # miniapps al instante, pero los scripts llegan a cada repo vía template-sync
        # (con lag). Si una miniapp todavía no sincronizó, los scripts no existen →
        # se saltea el gate en vez de romper el publish. Al sincronizar, el gate se activa.
        run: |
          if [ -f scripts/gen-manifest-shared.mjs ] && [ -f scripts/check-compat.mjs ]; then
            node scripts/gen-manifest-shared.mjs
            node scripts/check-compat.mjs
          else
            echo "compat gate scripts not present (miniapp not yet synced) — skipping"
          fi
        env:
          BACKSTAGE_URL: ${{ secrets.BACKSTAGE_URL }}
          COMPAT_ENFORCE: ${{ vars.COMPAT_ENFORCE }}

      - name: Build chunks (android + ios)
        # Ambos son chunks JS de Module Federation (sin nativo) → se buildean para
        # cualquier miniapp. iOS es best-effort: un fallo iOS NO bloquea el publish
        # de android (el crítico para prod).
        run: |
          ID=$(node -p "require('./manifest.json').id")
          echo "Building miniapp: $ID (android)"
          pnpm exec react-native webpack-bundle --platform android \
            --entry-file src/Entry.tsx \
            --bundle-output "build/${ID}.container.js.bundle" --dev false
          echo "Building miniapp: $ID (ios)"
          pnpm exec react-native webpack-bundle --platform ios \
            --entry-file src/Entry.tsx \
            --bundle-output "build/ios/${ID}.container.js.bundle" --dev false \
            || echo "iOS build failed — se publicará solo android"

      - name: Zip build outputs
        # Zip the FLAT contents of each emitted dir (container + chunks at the
        # root) so the host can resolve chunks beside the container. iOS va en su
        # propio zip → el registry lo guarda en el subfolder ios/.
        run: |
          cd build/generated/android && zip -r "$GITHUB_WORKSPACE/android.zip" . && cd "$GITHUB_WORKSPACE"
          if [ -d build/generated/ios ]; then
            cd build/generated/ios && zip -r "$GITHUB_WORKSPACE/ios.zip" . && cd "$GITHUB_WORKSPACE"
          fi

      - name: Publish to Backstage
        # publish.mjs (sincronizado vía template-sync) publica ambos chunks a la
        # MISMA versión. Una miniapp con el publish.mjs viejo (single-zip) ignora
        # el 2º arg → publica solo android (degradación segura, Capa 1 vs Capa 2 lag).
        run: |
          if [ -f ios.zip ]; then
            node scripts/publish.mjs android.zip ios.zip
          else
            node scripts/publish.mjs android.zip
          fi
        env:
          BACKSTAGE_URL: ${{ secrets.BACKSTAGE_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
