name: Template sync

# 3-way merge of the current template into this miniapp, opened as a PR (Capa 2).
# Explicit merge-base = baseSha in .template-sync, because template-generated repos
# share no git ancestry with the template. Never overwrites files listed in
# .templatesyncignore. Dispatched on demand (e.g. from Backstage). No extra secrets.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Never run on the template repo itself.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read marker
        id: marker
        run: |
          set -euo pipefail
          if [ ! -f .template-sync ]; then
            echo "::error::.template-sync missing — this repo is not enrolled for template sync. Backfill it first."
            exit 1
          fi
          TEMPLATE_REPO="$(jq -r .templateRepo .template-sync)"
          BASE="$(jq -r .baseSha .template-sync)"
          echo "template_repo=$TEMPLATE_REPO" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Fetch template
        id: fetch
        run: |
          set -euo pipefail
          git remote add template "https://github.com/${{ steps.marker.outputs.template_repo }}.git"
          git fetch template main
          HEAD_SHA="$(git rev-parse template/main)"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # El núcleo determinístico del 3-way merge vive en scripts/template-merge.mjs
      # (testeado con node:test). Este paso solo lo invoca; el push + PR van aparte.
      - name: 3-way merge (explicit base)
        id: merge
        env:
          BASE: ${{ steps.marker.outputs.base }}
          TEMPLATE_HEAD: ${{ steps.fetch.outputs.head }}
        run: |
          set -euo pipefail
          git config user.name "backstage-template-sync"
          git config user.email "template-sync@users.noreply.github.com"
          node scripts/template-merge.mjs

      - name: Push + open PR
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push -u origin "${{ steps.merge.outputs.branch }}"
          if [ "${{ steps.merge.outputs.conflicted }}" = "true" ]; then
            BODY="⚠️ Merge con **conflictos** — resuélvelos en este branch antes de mergear. Base \`${{ steps.marker.outputs.base }}\` → template \`${{ steps.merge.outputs.short }}\`."
          else
            BODY="Merge 3-way limpio desde el template (\`${{ steps.merge.outputs.short }}\`). Revisa el diff y el CI antes de mergear."
          fi
          gh pr create --title "Sync desde template @ ${{ steps.merge.outputs.short }}" --body "$BODY" \
            --base main --head "${{ steps.merge.outputs.branch }}"
